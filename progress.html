<!doctype html>
<meta charset="utf-8">
<title>Burnout Gauntlet — progress</title>
<!-- Live progress board.
     Data source is progress.json, regenerated by `node tools/progress.mjs`
     (also run by tools/refresh-latest.sh after every wave). That file is derived
     from verdicts/wave-*/ on disk, so the board cannot drift out of sync with the
     actual work the way the old STATE.md table-scraper did.
     Serve the repo root: node tools/serve.mjs -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 28px 60px; background: #0b0d10; color: #e6e8ea;
         font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  h1 { font-size: 20px; letter-spacing: .02em; margin: 0 0 4px; }
  .sub { color: #7c848c; margin-bottom: 24px; }
  .sub b { color: #e6e8ea; font-weight: 600; }
  .piece { border: 1px solid #1e242b; border-radius: 10px; margin-bottom: 16px;
           background: #11151a; overflow: hidden; }
  .piece.retired { opacity: .55; }
  .head { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px;
          border-bottom: 1px solid #1e242b; flex-wrap: wrap; }
  .name { font-weight: 600; }
  .round { color: #7c848c; font-variant-numeric: tabular-nums; }
  .waves { color: #4c545c; font-family: ui-monospace, monospace; font-size: 11px; }
  .verdict { margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 999px;
             background: #1e242b; color: #9aa4ad; white-space: nowrap; }
  .verdict.done { background: #12331f; color: #58d68d; }
  .verdict.building { background: #3a2d10; color: #e2b33c; }
  .verdict.losing { background: #35171a; color: #e08b8b; }
  .blind { padding: 10px 16px; color: #8d959d; font-size: 12px; border-bottom: 1px solid #1e242b; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1e242b; }
  figure { margin: 0; background: #0b0d10; }
  figcaption { padding: 6px 12px; font-size: 11px; color: #7c848c; text-transform: uppercase;
               letter-spacing: .08em; display: flex; gap: 8px; }
  figcaption .age { color: #4c545c; text-transform: none; letter-spacing: 0; margin-left: auto; }
  img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; background: #000; }
  .missing { display: grid; place-items: center; aspect-ratio: 16/9; color: #3c444c; font-size: 12px; }
  .err { color: #e08b8b; }
</style>
<h1>Burnout Gauntlet</h1>
<div class="sub" id="sub">loading progress.json…</div>
<div id="board"></div>
<script>
const bust = () => '?' + Date.now();

const plate = (src, cap, age) => src
  ? `<figure><img src="${src}${bust()}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'missing',textContent:'no image yet'}))">
       <figcaption>${cap}${age ? `<span class="age">${age}</span>` : ''}</figcaption></figure>`
  : `<figure><div class="missing">n/a</div><figcaption>${cap}</figcaption></figure>`;

const ago = ms => {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}h ${m % 60}m ago` : `${Math.floor(h / 24)}d ago`;
};

// A piece is DONE when the critic could not tell ours from the reference, or
// picked ours. "real wins" is the failing state — that is the whole point of the
// gauntlet, so it gets the red pill, not a neutral one.
const state = p => p.retired || /cannot tell|ours wins/i.test(p.verdict) ? 'done'
  : p.building ? 'building'
  : /real wins/i.test(p.verdict) ? 'losing' : '';

fetch('progress.json' + bust())
  .then(r => r.ok ? r.json() : Promise.reject(new Error('progress.json ' + r.status)))
  .then(d => {
    const done = d.pieces.filter(p => state(p) === 'done').length;
    document.getElementById('sub').innerHTML =
      `<b>${d.pieces.length}</b> pieces · <b>${done}</b> passed the bar · ` +
      `current wave <b>${d.currentWave}</b> · generated ${ago(Date.parse(d.generated))} · auto-refresh 15s`;

    document.getElementById('board').innerHTML = d.pieces.map(p => {
      const cls = state(p);
      return `<div class="piece ${p.retired ? 'retired' : ''}">
        <div class="head">
          <span class="name">${p.piece}</span>
          <span class="round">${p.rounds} judged round${p.rounds === 1 ? '' : 's'}${p.latestRound ? ` · latest ${p.latestRound}` : ''}</span>
          <span class="waves">${p.waves || '—'}</span>
          <span class="verdict ${cls}">${p.verdict}</span>
        </div>
        ${p.blind ? `<div class="blind">${p.blind}</div>` : ''}
        <div class="pair">
          ${plate(p.ours?.path, 'ours', p.ours && ago(p.ours.mtime))}
          ${plate(p.ref, p.scene ? 'reference: ' + p.scene : 'reference (by ear)')}
        </div></div>`;
    }).join('');
  })
  .catch(e => {
    // Surface the failure instead of rendering an empty board. An empty board
    // reads as "still loading" and that is exactly how the old scraper stayed
    // broken for several waves without anyone noticing.
    document.getElementById('sub').innerHTML =
      `<span class="err">board data unavailable: ${e.message} — run <code>node tools/progress.mjs</code></span>`;
  });

setTimeout(() => location.reload(), 15000);
</script>
